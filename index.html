<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sol Garanza — Городские Кланы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0b0c10; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }

        /* Шапка игры */
        #header {
            height: 60px; background: #1f2833; display: flex; justify-content: space-between;
            align-items: center; padding: 0 15px; border-bottom: 2px solid #45a29e;
        }
        .user-info { font-size: 14px; font-weight: bold; color: #66fcf1; }
        .user-info #player-name { font-size: 16px; margin-bottom: 2px; }
        .user-info #player-gang { font-size: 11px; color: #c5c6c7; }

        .stats { display: flex; gap: 15px; font-size: 13px; }
        .stat-item { background: #0b0c10; padding: 5px 10px; border-radius: 5px; border: 1px solid #45a29e; }

        /* Главный экран и вкладки */
        #main-container { height: calc(100vh - 120px); position: relative; overflow: hidden; }
        .tab-content { width: 100%; height: 100%; display: none; }
        .tab-content.active { display: block; }

        /* Нижнее меню навигации */
        #navbar {
            height: 60px; background: #1f2833; display: flex; justify-content: space-around;
            align-items: center; border-top: 2px solid #45a29e;
        }
        .nav-btn {
            background: none; border: none; color: #c5c6c7; font-size: 11px;
            display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
        }
        .nav-btn.active { color: #66fcf1; font-weight: bold; }
        .nav-btn icon { font-size: 18px; }

        /* Вкладка: Карта Города (Canvas) */
        #map-canvas { width: 100%; height: 100%; background: #121212; display: block; }
        #location-modal {
            position: absolute; bottom: 10px; left: 5%; width: 90%; background: rgba(31, 40, 51, 0.95);
            border: 2px solid #66fcf1; border-radius: 10px; padding: 15px; display: none;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.3); z-index: 100;
        }
        #location-modal h3 { color: #66fcf1; margin-bottom: 5px; }
        #location-modal p { font-size: 12px; color: #c5c6c7; margin-bottom: 10px; }
        .action-btn {
            background: #66fcf1; color: #0b0c10; border: none; padding: 8px 15px;
            font-weight: bold; border-radius: 5px; width: 100%; cursor: pointer;
        }

        /* Вкладка: Кланы (Банды) */
        #tab-clans { padding: 15px; overflow-y: auto; }
        .clan-section { background: #1f2833; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #45a29e; }
        .clan-section h3 { color: #66fcf1; margin-bottom: 10px; }
        .clan-input {
            width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px;
            border: 1px solid #45a29e; background: #0b0c10; color: #fff;
        }
        .clan-btn {
            background: #66fcf1; color: #0b0c10; border: none; padding: 10px;
            font-weight: bold; border-radius: 5px; width: 100%; cursor: pointer;
            margin-top: 5px;
        }
        .clan-list { list-style: none; padding: 0; }
        .clan-list li {
            background: #0b0c10; padding: 10px; border-radius: 5px; margin-bottom: 5px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #45a29e;
        }
        .clan-list li span { font-size: 13px; }
        .clan-list li button {
            background: #45a29e; color: #0b0c10; border: none; padding: 5px 10px;
            border-radius: 3px; font-size: 11px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div id="header">
        <div class="user-info">
            <div id="player-name">Игрок</div>
            <div id="player-gang">Банда: Нет</div>
        </div>
        <div class="stats">
            <div class="stat-item">💵 $<span id="player-money">100,000</span></div>
            <div class="stat-item">⚡ <span id="player-power">50</span></div>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ (ВКЛАДКИ) -->
    <div id="main-container">
        
        <!-- ВКЛАДКА 1: КАРТА ГОРОДА -->
        <div id="tab-map" class="tab-content active">
            <canvas id="map-canvas"></canvas>
            
            <!-- Модальное окно при клике на объект карты -->
            <div id="location-modal">
                <h3 id="loc-title">Название локации</h3>
                <p id="loc-desc">Описание локации...</p>
                <button class="action-btn" onclick="interactLocation()">Войти / Захватить</button>
            </div>
        </div>

        <!-- ВКЛАДКА 2: КЛАНЫ (БАНДЫ) -->
        <div id="tab-clans" class="tab-content">
            <h2 style="color: #66fcf1; margin-bottom: 15px;">Управление Кланами (Бандами)</h2>

            <div id="my-clan-section" class="clan-section">
                <!-- Контент для своего клана или форма для создания/вступления -->
            </div>
            
            <div class="clan-section">
                <h3>Все Кланы (Банды) Города</h3>
                <ul id="all-clans-list" class="clan-list">
                    <!-- Список всех кланов будет здесь -->
                </ul>
            </div>
        </div>

        <!-- ВКЛАДКА 3: ПРОФИЛЬ (КАСТОМИЗАЦИЯ И ЭКИПИРОВКА) -->
        <div id="tab-profile" class="tab-content" style="padding: 15px;">
            <h2 style="color: #66fcf1;">Профиль Персонажа</h2>
            <p style="margin-top: 10px; color: #c5c6c7;">Здесь будет кастомизация и экипировка персонажа.</p>
        </div>

    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div id="navbar">
        <button class="nav-btn active" onclick="switchTab('map', this)">
            <span>🗺️</span> Карта
        </button>
        <button class="nav-btn" onclick="switchTab('clans', this)">
            <span>🤝</span> Кланы
        </button>
        <button class="nav-btn" onclick="switchTab('profile', this)">
            <span>👤</span> Профиль
        </button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        // --- ДАННЫЕ ИГРОКА (СОХРАНЯЕМ В localStorage) ---
        let player = JSON.parse(localStorage.getItem('playerData')) || {
            id: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : `guest_${Math.random().toString(36).substring(2, 9)}`,
            name: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.first_name : "Босс",
            money: 100000,
            power: 50,
            clan: null // ID или название клана, в котором состоит игрок
        };

        // --- ДАННЫЕ О КЛАНАХ (СОХРАНЯЕМ В localStorage) ---
        let clans = JSON.parse(localStorage.getItem('clans')) || {}; // Все созданные кланы

        // --- ДАННЫЕ ОБЪЕКТОВ НА КАРТЕ ---
        const locations = [
            { id: 1, name: "Морской Порт & Пирс", type: "sea", x: 80, y: 80, color: "#0077be", desc: "Причалы, корабли, контрабанда и море." },{ id: 2, name: "Старая Свалка", type: "junk", x: 15, y: 75, color: "#5a5a5a", desc: "Горы металлолома, заброшенные машины и тайники." },
            { id: 3, name: "Центральный Банк", type: "city", x: 50, y: 45, color: "#ffd700", desc: "Финансовый центр Sol Garanza." },
            { id: 4, name: "Даунтаун (Небоскребы)", type: "city", x: 50, y: 30, color: "#45a29e", desc: "Высотные здания, офисы мафии и элитная недвижимость." },
            { id: 5, name: "Северное Гетто", type: "ghetto", x: 20, y: 20, color: "#e74c3c", desc: "Опасные улицы, где сила решает всё." },
            { id: 6, name: "Аэропорт", type: "infra", x: 80, y: 20, color: "#f39c12", desc: "Взлетные полосы и ангары." }
            // Добавь остальные 18 локаций сюда!
        ];

        let selectedLocation = null;

        // --- ФУНКЦИИ СОХРАНЕНИЯ/ЗАГРУЗКИ ---
        function saveGame() {
            localStorage.setItem('playerData', JSON.stringify(player));
            localStorage.setItem('clans', JSON.stringify(clans));
            updateUI();
        }

        // --- ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ---
        function updateUI() {
            document.getElementById('player-name').innerText = player.name;
            document.getElementById('player-money').innerText = player.money.toLocaleString();
            document.getElementById('player-power').innerText = player.power;
            document.getElementById('player-gang').innerText = `Банда: ${player.clan || 'Нет'}`;
            // Дополнительные обновления UI по мере разработки
        }

        // --- ФУНКЦИИ КЛАНОВ (БАНД) ---
        const CLAN_CREATION_COST = 50000;

        function createClan() {
            if (player.clan) {
                alert('Вы уже состоите в клане!');
                return;
            }
            if (player.money < CLAN_CREATION_COST) {
                alert(`Недостаточно средств. Для создания клана нужно $${CLAN_CREATION_COST}!`);
                return;
            }

            let clanName = prompt("Введите название нового клана (банды):");
            if (clanName && clanName.trim().length >= 3) {
                clanName = clanName.trim();
                if (clans[clanName]) {
                    alert('Клан с таким названием уже существует!');
                    return;
                }

                player.money -= CLAN_CREATION_COST;
                player.clan = clanName;
                clans[clanName] = {
                    name: clanName,
                    leaderId: player.id,
                    leaderName: player.name,
                    rating: 0,
                    members: [{ id: player.id, name: player.name, power: player.power }]
                };
                alert(`Клан "${clanName}" успешно создан!`);
                saveGame();
                renderClansTab();
            } else {
                alert('Название клана должно быть не менее 3 символов.');
            }
        }

        function joinClan(clanName) {
            if (player.clan) {
                alert(`Вы уже состоите в клане "${player.clan}"!`);
                return;
            }
            if (!clans[clanName]) {
                alert('Клан не найден.');
                return;
            }

            player.clan = clanName;
            clans[clanName].members.push({ id: player.id, name: player.name, power: player.power });
            alert(`Вы вступили в клан "${clanName}"!`);
            saveGame();
            renderClansTab();
        }

        function leaveClan() {
            if (!player.clan) {
                alert('Вы не состоите ни в каком клане.');
                return;
            } 

            // Если лидер покинул, назначить нового лидера (первого в списке)
                    currentClan.leaderId = currentClan.members[0].id;
                    currentClan.leaderName = currentClan.members[0].name;
                }
                
                player.clan = null;
                alert('Вы покинули клан.');
                saveGame();
                renderClansTab();
            }
        }

        function renderClansTab() {
            const myClanSection = document.getElementById('my-clan-section');
            const allClansList = document.getElementById('all-clans-list');
            
            // Секция "Мой клан"
            if (player.clan) {
                const myClan = clans[player.clan];
                myClanSection.innerHTML = `
                    <h3>Ваш Клан: ${myClan.name}</h3>
                    <p>Лидер: ${myClan.leaderName}</p>
                    <p>Рейтинг: ${myClan.rating} 👊</p>
                    <p>Участники (${myClan.members.length}):</p>
                    <ul class="clan-list">
                        ${myClan.members.map(member => `<li><span>${member.name} (⚡${member.power})</span></li>`).join('')}
                    </ul>
                    <button class="clan-btn" onclick="leaveClan()">Покинуть клан</button>
                `;
            } else {
                myClanSection.innerHTML = `
                    <h3>Вы не состоите в клане</h3>
                    <button class="clan-btn" onclick="createClan()">Создать новый клан ($${CLAN_CREATION_COST})</button>
                `;
            }

            // Список всех кланов
            allClansList.innerHTML = '';
            const existingClans = Object.values(clans);
            if (existingClans.length === 0) {
                allClansList.innerHTML = '<li>Нет созданных кланов. Будь первым!</li>';
            } else {
                existingClans.forEach(clan => {
                    allClansList.innerHTML += `
                        <li>
                            <span>${clan.name} (Лидер: ${clan.leaderName})</span>
                            <span>⚡${clan.rating} 👊</span>
                            ${!player.clan ? `<button onclick="joinClan('${clan.name}')">Вступить</button>` : ''}
                        </li>
                    `;
                });
            }
        }


        // --- ОБЩИЕ ФУНКЦИИ ВКЛАДОК ---
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');

            if (tabId === 'map') initMap();
            if (tabId === 'clans') renderClansTab();
            // if (tabId === 'profile') renderProfileTab(); // Будет добавлено позже
        }

        // --- ДВИЖОК ОТРИСОВКИ КАРТЫ (CANVAS) ---
        function initMap() {
            const canvas = document.getElementById('map-canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            // Отрисовка фона карты (Суша + Море)
            ctx.fillStyle = "#1e272e"; // Суша
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Океан / Море справа и снизу
            ctx.fillStyle = "#0f3460";
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.6, canvas.height);
            ctx.lineTo(canvas.width, canvas.height * 0.6);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.fill();

            // Отрисовка объектов/зданий на карте
            locations.forEach(loc => {
                const pixelX = (loc.x / 100) * canvas.width;
                const pixelY = (loc.y / 100) * canvas.height;

                // Отрисовка зоны
                ctx.beginPath();
                ctx.arc(pixelX, pixelY, 18, 0
            if (confirm(`Вы уверены, что хотите покинуть клан "${player.clan}"?`)) {
                let currentClan = clans[player.clan];
                currentClan.members = currentClan.members.filter(member => member.id !== player.id);

                if (currentClan.members.length === 0) {
                    delete clans[player.clan]; // Удалить клан, если он опустел
                } else if (currentClan.leaderId === player.id) {

                }

                    , 2 * Math.PI);
                ctx.fillStyle = loc.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                // Подпись локации
                ctx.fillStyle = "#ffffff";
                ctx.font = "10px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(loc.name, pixelX, pixelY + 30);
            });

            // Обработка клика по карте
            canvas.onclick = function(e) {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                let found = false;
                locations.forEach(loc => {
                    const pixelX = (loc.x / 100) * canvas.width;
                    const pixelY = (loc.y / 100) * canvas.height;

                    const distance = Math.sqrt((clickX - pixelX) ** 2 + (clickY - pixelY) ** 2);
                    if (distance <= 20) {
                        showLocationModal(loc);
                        found = true;
                    }
                });

                if (!found) {
                    document.getElementById('location-modal').style.display = 'none';
                }
            };
        }

        function showLocationModal(loc) {
            selectedLocation = loc;
            document.getElementById('loc-title').innerText = loc.name;
            document.getElementById('loc-desc').innerText = loc.desc;
            document.getElementById('location-modal').style.display = 'block';
        }

        function interactLocation() {
            if (selectedLocation) {
                alert(`Вы взаимодействуете с объектом: ${selectedLocation.name}`);
            }
        }

        // --- ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ ---
        window.onload = () => {
            updateUI(); // Обновить все данные в UI
            initMap();  // Инициализировать карту
            switchTab('map', document.querySelector('#navbar .nav-btn')); // Активировать вкладку "Карта" по умолчанию
        };
        window.onresize = () => {
            if (document.getElementById('tab-map').classList.contains('active')) {
                initMap();
            }
        };
    </script>
</body>
</html>
