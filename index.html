<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Game Map</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0d1117; font-family: sans-serif; }
        canvas { display: block; touch-action: none; }
        
        /* Плашка с информацией сверху */
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        #district-name { font-weight: bold; color: #58a6ff; }
    </style>
</head>
<body>

    <div id="ui">
        Район: <span id="district-name">Выберите область</span>
    </div>

    <canvas id="mapCanvas"></canvas>

<script>
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const districtNameUI = document.getElementById('district-name');

// Размеры всего игрового мира (карта больше экрана)
const WORLD_WIDTH = 3000;
const WORLD_HEIGHT = 2000;

// Камера (смещение и зум)
let camera = { x: WORLD_WIDTH / 2, y: WORLD_HEIGHT / 2, zoom: 0.8 };
let isDragging = false;
let startX = 0, startY = 0;
let selectedDistrict = null;

// Данные о районах карты (координаты полигонов)
const districts = [
    {
        id: 1, name: "Центральный Сити", color: "#8a2be2",
        path: [{x: 1200, y: 800}, {x: 1800, y: 800}, {x: 1900, y: 1300}, {x: 1100, y: 1200}]
    },
    {
        id: 2, name: "Промышленная Зона", color: "#ff4500",
        path: [{x: 400, y: 400}, {x: 1100, y: 500}, {x: 1100, y: 1200}, {x: 300, y: 1000}]
    },
    {
        id: 3, name: "Портовый Район", color: "#1e90ff",
        path: [{x: 1800, y: 800}, {x: 2600, y: 600}, {x: 2700, y: 1400}, {x: 1900, y: 1300}]
    },
    {
        id: 4, name: "Спальный Район (Север)", color: "#2ed573",
        path: [{x: 1100, y: 500}, {x: 1800, y: 300}, {x: 2600, y: 600}, {x: 1800, y: 800}]
    },
    {
        id: 5, name: "Заброшенные Пустоши", color: "#ffa500",
        path: [{x: 300, y: 1000}, {x: 1100, y: 1200}, {x: 1900, y: 1300}, {x: 1500, y: 1800}, {x: 500, y: 1700}]
    }
];

// Настройка размеров Canvas
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- ОРРИСОВКА (RENDER) ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    // Трансформация карты под камеру (смещение + масштабирование)
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x, -camera.y);

    // 1. Фон океана/воды
    ctx.fillStyle = '#090d16';
    ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

    // 2. Сетка на фоне
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 2;
    const gridSize = 100;
    for (let x = 0; x < WORLD_WIDTH; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_HEIGHT); ctx.stroke();
    }
    for (let y = 0; y < WORLD_HEIGHT; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_WIDTH, y); ctx.stroke();
    }

    // 3. Отрисовка районов
    districts.forEach(district => {
        const isSelected = selectedDistrict && selectedDistrict.id === district.id;

        ctx.beginPath();
        district.path.forEach((pt, index) => {
            if (index === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
        });
        ctx.closePath();

        // Заполнение района
        ctx.fillStyle = district.color + (isSelected ? '88' : '33'); // Прозрачность
        ctx.fill();

        // Обводка (Свечение)
        ctx.lineWidth = isSelected ? 8 : 4;
        ctx.strokeStyle = district.color;
        ctx.shadowColor = district.color;
        ctx.shadowBlur = isSelected ? 20 : 5;
        ctx.stroke();
        ctx.shadowBlur = 0; // Сброс тени

        // Текст (Название района по центру)
        const center = getPolygonCenter(district.path);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(district.name, center.x, center.y);
    });

    // Граница карты
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 10;
    ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

    ctx.restore();

    requestAnimationFrame(draw);
}

// Вспомогательная функция: поиск центра района для текста
function getPolygonCenter(points) {
    let x = 0, y = 0;
    points.forEach(p => { x += p.x; y += p.y; });
    return { x: x / points.length, y: y / points.length };
}

// Проверка: находится ли точка внутри района
function isPointInPolygon(point, polygon) {
    let x = point.x, y = point.y;
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        let xi = polygon[i].x, yi = polygon[i].y;
        let xj = polygon[j].x, yj = polygon[j].y;
        let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
    }
    return inside;
}

// Конвертация экранных координат в игровые
function screenToWorld(screenX, screenY) {
    return {
        x: (screenX - canvas.width / 2) / camera.zoom + camera.x,
        y: (screenY - canvas.height / 2) / camera.zoom + camera.y
    };
}

// --- УПРАВЛЕНИЕ (Touch / Mouse) ---

// Начало нажатия
function handleStart(e) {
    isDragging = true;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    startX = clientX;
    startY = clientY;
}

// Перетаскивание
function handleMove(e) {
    if (!isDragging) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    const dx = clientX - startX;
    const dy = clientY - startY;

    camera.x -= dx / camera.zoom;
    camera.y -= dy / camera.zoom;

    // Ограничение камеры в пределах карты
    camera.x = Math.max(0, Math.min(WORLD_WIDTH, camera.x));
    camera.y = Math.max(0, Math.min(WORLD_HEIGHT, camera.y));

    startX = clientX;
    startY = clientY;
}

// Конец нажатия (Клик)
function handleEnd(e) {
    isDragging = false;
}

// Клик по району
canvas.addEventListener('click', (e) => {
    const worldPos = screenToWorld(e.clientX, e.clientY);
    let clickedDistrict = null;

    districts.forEach(district => {
        if (isPointInPolygon(worldPos, district.path)) {
            clickedDistrict = district;
        }
    });

    if (clickedDistrict) {
        selectedDistrict = clickedDistrict;
        districtNameUI.innerText = clickedDistrict.name;
        districtNameUI.style.color = clickedDistrict.color;
    }
});

// Слушатели событий
canvas.addEventListener('mousedown', handleStart);
window.addEvent
Listener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);

canvas.addEventListener('touchstart', handleStart);
window.addEventListener('touchmove', handleMove);
window.addEventListener('touchend', handleEnd);

// Масштабирование колесиком (Зум)
canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = 1.1;
    if (e.deltaY < 0) camera.zoom = Math.min(camera.zoom * zoomFactor, 2.5); // Приближение
    else camera.zoom = Math.max(camera.zoom / zoomFactor, 0.4); // Отдаление
});

// Запуск отрисовки
draw();
</script>
</body>
</html>
